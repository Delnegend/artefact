name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      # `just bump` runs `cargo check -p artefact-cli`, which compiles
      # `artefact-core` — and its `lib.rs` is `#![feature(portable_simd)]`,
      # nightly-only. Without this the runner's default stable toolchain
      # fails the bump with E0554. Matches the toolchain used in the gates.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          GATE_SHA: ${{ github.sha }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # TOCTOU guard: the gate ran on GATE_SHA. If main moved since,
          # the checkout below is ungated code — refuse to ship it.
          # (Ref paths pin their own commit, so they skip this check.)
          if [ -z "$INPUT_REF" ]; then
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$HEAD_SHA" != "$GATE_SHA" ]; then
              echo "::error::main moved during the gate ($GATE_SHA -> $HEAD_SHA); re-run to gate the new HEAD."
              exit 1
            fi
          fi
          # Dispatch guide: empty = ship, SHA = test, tag = rebuild.
          # Dry-run first: a preview must never mutate, on any path.
          if [ "$DRY_RUN" = "true" ]; then
            if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{7,64}$'; then
              echo "[dry-run] would test-build commit $INPUT_REF (no publish)"
            elif [ -z "$INPUT_REF" ]; then
              echo "[dry-run] would bump to $NEXT_STRICT, tag $NEXT, push, build, and publish"
            elif echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "[dry-run] would rebuild tag $INPUT_REF and publish it"
            else
              echo "::error::ref must be empty, a commit SHA (7-64 hex), or a version tag (vX.Y.Z); got '$INPUT_REF'."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # SHA test-build: full hashes only (short SHAs misroute or collide).
          if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{7,64}$'; then
            echo "Test build against commit $INPUT_REF (will not publish)."
            { echo "ref=$INPUT_REF"; echo "version=$INPUT_REF"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tag rebuild: strict format, must already exist.
          if [ -n "$INPUT_REF" ]; then
            echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::ref must be a commit SHA or a version tag (vX.Y.Z); got '$INPUT_REF'."; exit 1; }
            git rev-parse -q --verify "refs/tags/$INPUT_REF" >/dev/null || { echo "::error::tag $INPUT_REF does not exist."; exit 1; }
            echo "Rebuilding existing tag $INPUT_REF."
            { echo "ref=$INPUT_REF"; echo "version=${INPUT_REF#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Recovery before the BUMP=none exit: a previous run may have pushed
          # the bump commit but died before tagging. Both manifests must agree.
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          MANIFEST_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          FRONTEND_VER="$(grep -m1 '"version"' frontend/package.json | cut -d'"' -f4)"
          if [ -n "$LATEST_TAG" ] && [ -n "$MANIFEST_VER" ] && [ "$MANIFEST_VER" = "$FRONTEND_VER" ] && [ "v$MANIFEST_VER" != "$LATEST_TAG" ] && [ "$(printf '%s\n%s\n' "v$MANIFEST_VER" "$LATEST_TAG" | sort -V | head -n1)" = "$LATEST_TAG" ]; then
            echo "Manifests ($MANIFEST_VER) are ahead of latest tag ($LATEST_TAG); tagging the stranded commit."
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            TAG="v$MANIFEST_VER"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            { echo "ref=$TAG"; echo "version=$MANIFEST_VER"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing releasable since the last tag: clean exit, no noise.
          # semver-action returns before setOutput('bump') when there are no
          # new commits at all, so NEXT is the reliable signal, not BUMP.
          # Guarding on BUMP alone leaves NEXT empty, which either trips the
          # re-ship guard or ships an empty ref.
          if [ -z "$NEXT" ] || [ "$BUMP" = "none" ]; then
            echo "No version bump needed (current: ${CURRENT:-none})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse to re-ship: NEXT must sort after the latest tag.
          if [ -n "$LATEST_TAG" ]; then
            if [ "$NEXT" = "$LATEST_TAG" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$LATEST_TAG" | sort -V | head -n1)" = "$NEXT" ]; then
              echo "::error::Calculated $NEXT is not ahead of latest tag $LATEST_TAG; nothing new to ship."
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          just bump "$NEXT_STRICT"
          git add -u
          git diff --staged --quiet && { echo "::error::bump produced no change in package files"; exit 1; }
          git commit -m "chore(release): ${NEXT}"
          # Push the commit first: if the tag push fails, the next run
          # recovers via the manifest-ahead check above.
          git push origin HEAD:main
          git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null && { echo "::error::tag ${NEXT} already exists"; exit 1; }
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
          { echo "ref=$NEXT"; echo "version=$NEXT_STRICT"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux/x64
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: windows/x64
            artifact: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin/arm64
            artifact: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        shell: bash
        env:
          ARTEFACT_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          touch backend/artefact-cli/main.rs
          cargo build --bin artefact-cli --release --target "$CARGO_TARGET"

      - name: Compress binaries
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          MATRIX_OS: ${{ matrix.os }}
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          BASE="artefact-cli-${VERSION}-${ARTIFACT}"
          mkdir -p "$BASE"
          if [ "$MATRIX_OS" = "windows-latest" ]; then
            cp "target/${CARGO_TARGET}/release/artefact-cli.exe" "$BASE/"
            7z a -tzip "${BASE}.zip" "$BASE"
          else
            cp "target/${CARGO_TARGET}/release/artefact-cli" "$BASE/"
            tar -czf "${BASE}.tar.gz" "$BASE"
          fi
          rm -rf "$BASE"

      - name: Upload artifact (tar.gz)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefact-cli-${{ matrix.artifact }}
          path: artefact-cli-*.tar.gz
          if-no-files-found: ignore

      - name: Upload artifact (zip)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefact-cli-${{ matrix.artifact }}
          path: artefact-cli-*.zip
          if-no-files-found: ignore

  release:
    name: Tag & Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Publish Consolidated Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
