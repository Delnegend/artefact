name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      # `just bump` runs `cargo check -p artefact-cli`, which compiles
      # `artefact-core` — and its `lib.rs` is `#![feature(portable_simd)]`,
      # nightly-only. Without this the runner's default stable toolchain
      # fails the bump with E0554. Matches the toolchain used in the gates.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@e5a0d7c3af36381065080b6272d91fde28d17414 # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          manifest-path: Cargo.toml
          bump-command: just bump
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux/x64
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: windows/x64
            artifact: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin/arm64
            artifact: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        shell: bash
        env:
          ARTEFACT_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          touch backend/artefact-cli/main.rs
          cargo build --bin artefact-cli --release --target "$CARGO_TARGET"

      - name: Compress binaries
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          MATRIX_OS: ${{ matrix.os }}
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          BASE="artefact-cli-${VERSION}-${ARTIFACT}"
          mkdir -p "$BASE"
          if [ "$MATRIX_OS" = "windows-latest" ]; then
            cp "target/${CARGO_TARGET}/release/artefact-cli.exe" "$BASE/"
            7z a -tzip "${BASE}.zip" "$BASE"
          else
            cp "target/${CARGO_TARGET}/release/artefact-cli" "$BASE/"
            tar -czf "${BASE}.tar.gz" "$BASE"
          fi
          rm -rf "$BASE"

      - name: Upload artifact (tar.gz)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefact-cli-${{ matrix.artifact }}
          path: artefact-cli-*.tar.gz
          if-no-files-found: ignore

      - name: Upload artifact (zip)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefact-cli-${{ matrix.artifact }}
          path: artefact-cli-*.zip
          if-no-files-found: ignore

  release:
    name: Tag & Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Publish Consolidated Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
