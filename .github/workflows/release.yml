name: Release

# Weekly batched release: dependency and feature/fix updates accumulate on
# `main` and ship as one patch release. Also dispatchable manually with an
# explicit version.
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Explicit version (e.g. 0.1.0) - leave empty for auto patch bump'
        required: false
        type: string
        default: ""

env:
  BINARY_NAME: artefact-cli

permissions:
  contents: read

# Serialise releases so tag creation cannot collide.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.commits.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since last release
        id: commits
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ -n "$LATEST_TAG" ]; then
            COUNT="$(git rev-list "${LATEST_TAG}..HEAD" --count)"
            echo "Commits since $LATEST_TAG: $COUNT"
            if [ "$COUNT" -eq 0 ] && [ -z "${{ inputs.release_version }}" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No new commits since $LATEST_TAG; skipping release."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Determine version
        if: steps.commits.outputs.skip != 'true'
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            NEXT_VERSION="${{ inputs.release_version }}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
            PLAIN_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$PLAIN_VERSION"
            major="${major:-0}"
            minor="${minor:-1}"
            patch="${patch:-0}"
            if [ "$LATEST_TAG" = "v0.0.0" ]; then
              NEXT_VERSION="0.1.0"
            else
              NEXT_VERSION="${major}.${minor}.$((patch + 1))"
            fi
            echo "Latest tag: $LATEST_TAG, next version: $NEXT_VERSION"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux/x64
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: windows/x64
            artifact: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin/arm64
            artifact: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          ARTEFACT_BUILD_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          # `option_env!` is not fingerprint-tracked by cargo, so force a
          # rebuild to pick up the injected version even when rust-cache
          # restores a previously-built binary.
          touch backend/artefact-cli/main.rs
          cargo build --bin artefact-cli --release --target ${{ matrix.target }}

      - name: Compress binaries
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.release_version }}"
          BASE="${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "$BASE"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/artefact-cli.exe" "$BASE/"
            7z a -tzip "${BASE}.zip" "$BASE"
          else
            cp "target/${{ matrix.target }}/release/artefact-cli" "$BASE/"
            tar -czf "${BASE}.tar.gz" "$BASE"
          fi
          rm -rf "$BASE"
          ls -lh "${BASE}".*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}
          path: ${{ env.BINARY_NAME }}-*

  release:
    name: Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from commits since the last tag
        id: notes
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
            COMPARE=""
          fi
          echo "Generating notes for range $RANGE"
          TMP="$(mktemp -d)"
          git log --pretty=format:"%s" "$RANGE" > "$TMP/all"
          {
            echo "## What's Changed"
            echo
            for spec in "feat **Features**" "fix **Bug Fixes**" "docs **Documentation**" "ci **CI & Workflows**" "test **Tests**" "refactor **Refactoring**" "perf **Performance**" "chore **Chores**" "build **Build**"; do
              type="${spec%% *}"
              grep -E "^${type}(\([^)]*\))?: " "$TMP/all" > "$TMP/items" || continue
              echo "${spec#* }"
              sed -E "s/^${type}(\([^)]*\))?: +/  - /" "$TMP/items"
              echo
            done
            grep -Ev "^[a-z]+(\([^)]*\))?: " "$TMP/all" > "$TMP/other" || true
            if [ -s "$TMP/other" ]; then
              echo "**Other**"
              sed 's/^/  - /' "$TMP/other"
              echo
            fi
            echo "**Downloads**"
            echo "- **Linux x64**: \`.tar.gz\` (extract with \`tar -xzf\`)"
            echo "- **Windows x64**: \`.zip\` (contains \`artefact-cli.exe\`)"
            echo "- **macOS Apple Silicon**: \`.tar.gz\` (\`aarch64-apple-darwin\`, extract with \`tar -xzf\`)"
            if [ -n "$COMPARE" ]; then
              echo
              echo "**Full Changelog**: $COMPARE"
            fi
          } > notes.md
          echo "=== draft release notes ==="
          cat notes.md
          echo "notes=$PWD/notes.md" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.release_version }}
          name: v${{ needs.prepare.outputs.release_version }}
          body_path: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
