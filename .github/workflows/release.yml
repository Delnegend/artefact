name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # Test-build path: a SHA means build that commit with no publish.
          if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{4,64}$'; then
            echo "Test build against commit $INPUT_REF (will not publish)."
            { echo "ref=$INPUT_REF"; echo "version=$INPUT_REF"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_REF" ]; then
            echo "Rebuilding existing tag $INPUT_REF."
            { echo "ref=$INPUT_REF"; echo "version=${INPUT_REF#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing releasable since the last tag: clean exit, no noise.
          if [ "$BUMP" = "none" ]; then
            echo "No version bump needed (current: ${CURRENT:-none})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse to re-ship: NEXT must sort after the latest tag.
          # (Catches re-runs after a release already shipped this version.)
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$LATEST_TAG" ]; then
            if [ "$NEXT" = "$LATEST_TAG" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$LATEST_TAG" | sort -V | head -n1)" = "$NEXT" ]; then
              echo "::error::Calculated $NEXT is not ahead of latest tag $LATEST_TAG; nothing new to ship."
              exit 1
            fi
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would bump to $NEXT_STRICT, tag $NEXT, push, build, and publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          just bump "$NEXT_STRICT"
          git add -u
          if git diff --staged --quiet; then
            # Recovery: the bump already landed on main (a previous run's
            # push succeeded but tagging failed). Tag the existing commit
            # and ship it. Both manifests must agree, else fail.
            MANIFEST_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            FRONTEND_VER="$(grep -m1 '"version"' frontend/package.json | cut -d'"' -f4)"
            [ -n "$MANIFEST_VER" ] || { echo "::error::No version in Cargo.toml"; exit 1; }
            [ "$MANIFEST_VER" = "$FRONTEND_VER" ] || { echo "::error::Cargo.toml ($MANIFEST_VER) != frontend/package.json ($FRONTEND_VER)"; exit 1; }
            if [ "v$MANIFEST_VER" != "$NEXT" ]; then
              echo "::error::bump produced no change, and manifests ($MANIFEST_VER) disagree with calculated $NEXT_STRICT."
              exit 1
            fi
            echo "Manifests already at $NEXT; tagging the existing commit."
          else
            git commit -m "chore(release): ${NEXT}"
            # Push the commit first: if the tag push fails, main still has
            # the bump and the next run recovers via the branch above.
            git push origin HEAD:main
          fi
          git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null && { echo "::error::tag ${NEXT} already exists"; exit 1; }
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
          { echo "ref=$NEXT"; echo "version=$NEXT_STRICT"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux/x64
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: windows/x64
            artifact: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin/arm64
            artifact: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        env:
          ARTEFACT_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          touch backend/artefact-cli/main.rs
          cargo build --bin artefact-cli --release --target ${{ matrix.target }}

      - name: Compress binaries
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BASE="artefact-cli-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "$BASE"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/artefact-cli.exe" "$BASE/"
            7z a -tzip "${BASE}.zip" "$BASE"
          else
            cp "target/${{ matrix.target }}/release/artefact-cli" "$BASE/"
            tar -czf "${BASE}.tar.gz" "$BASE"
          fi
          rm -rf "$BASE"

      - name: Upload artifact (tar.gz)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefact-cli-${{ matrix.artifact }}
          path: artefact-cli-*.tar.gz
          if-no-files-found: ignore

      - name: Upload artifact (zip)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefact-cli-${{ matrix.artifact }}
          path: artefact-cli-*.zip
          if-no-files-found: ignore

  release:
    name: Tag & Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Publish Consolidated Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
