name: Release

# Weekly batched release: updates accumulate on `main` and ship as one
# release. The next version comes from Conventional Commits since the latest
# tag via ietf-tools/semver-action — no manual version input.
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC
  workflow_dispatch:

env:
  BINARY_NAME: artefact-cli

permissions:
  contents: read

# Serialise releases so tag creation cannot collide.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.next }}
      version_strict: ${{ steps.semver.outputs.nextStrict }}
      skip: ${{ steps.semver.outputs.bump == 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version (Conventional Commits)
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux/x64
            artifact: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: windows/x64
            artifact: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin/arm64
            artifact: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          ARTEFACT_BUILD_VERSION: ${{ needs.prepare.outputs.version_strict }}
        run: |
          # `option_env!` is not fingerprint-tracked by cargo, so force a
          # rebuild to pick up the injected version even when rust-cache
          # restores a previously-built binary.
          touch backend/artefact-cli/main.rs
          cargo build --bin artefact-cli --release --target ${{ matrix.target }}

      - name: Compress binaries
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version_strict }}"
          BASE="${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "$BASE"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/artefact-cli.exe" "$BASE/"
            7z a -tzip "${BASE}.zip" "$BASE"
          else
            cp "target/${{ matrix.target }}/release/artefact-cli" "$BASE/"
            tar -czf "${BASE}.tar.gz" "$BASE"
          fi
          rm -rf "$BASE"
          ls -lh "${BASE}".*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}
          path: ${{ env.BINARY_NAME }}-*

  release:
    name: Tag & Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
