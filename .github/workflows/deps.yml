name: Dependency updates

on:
  schedule:
    - cron: '0 2 * * *' # Daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deps-main
  cancel-in-progress: false

jobs:
  update:
    uses: Delnegend/actions/.github/workflows/reusable-deps-update.yml@0e55ed74d7039e8f1f5b23607345eefaef65d8b4 # v1
    with:
      cargo: true
      bun: true
      bun-dir: frontend
