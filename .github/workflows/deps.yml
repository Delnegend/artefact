name: Dependency updates

on:
  schedule:
    - cron: '0 2 * * *' # Daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deps-main
  cancel-in-progress: false

jobs:
  update:
    uses: Delnegend/actions/.github/workflows/reusable-deps-update.yml@da085f98404ececa327b6d00b05341e002787f3e # v1
    with:
      cargo: true
      bun: true
      bun-dir: frontend
