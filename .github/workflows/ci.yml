name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls the whole file as its gate: all jobs below
  # must pass before anything ships.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cross-builds live in release.yml; PRs only need `just check`.
jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install frontend dependencies
        run: bun install
        working-directory: ./frontend

      - name: Run verification
        run: just check

  # Security scans. They need Docker images and registry egress, so they only run
  # on GitHub-hosted runners. None of them is a required check — the branch
  # protection contract stays `Check (just check)`.
  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@6b0ff42cc9e8937cd1b37faebccd093fc6c68a86 # v1
    permissions:
      contents: read
    with:
      scans: gitleaks actionlint semgrep trivy osv
      osv-config: osv-scanner.toml
