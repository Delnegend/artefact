name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cross-builds live in release.yml; PRs only need `just check`.
jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Vulkan software driver (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install frontend dependencies
        run: bun install
        working-directory: ./frontend

      - name: Run verification
        run: just check

  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
    permissions:
      contents: read
