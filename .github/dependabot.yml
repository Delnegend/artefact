version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    labels:
      - dependencies
    assignees:
      - Delnegend
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    labels:
      - dependencies
    assignees:
      - Delnegend
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
