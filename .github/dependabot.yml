version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    labels:
      - dependencies
    assignees:
      - Delnegend
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    labels:
      - dependencies
    assignees:
      - Delnegend
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    ignore:
      # TS 7 breaks `@vue/compiler-sfc` ("No fs option provided ... resolving
      # imported types") so `nuxt generate` fails; revisit once the Vue
      # toolchain supports it. Ignoring it also keeps the grouped PR non-major
      # so the other minor/patch updates can auto-merge.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
