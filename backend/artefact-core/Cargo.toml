[package]
name = "artefact-core"
version.workspace = true
edition.workspace = true
autobenches = false

[lints]
workspace = true

[dependencies]
image = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
zune-jpegxl = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
futures-channel = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
jxl-oxide = { version = "0.12.6", default-features = false }
pollster = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }

[lib]
name = "artefact_core"
path = "lib.rs"

[features]
simd = []
gpu = ["dep:wgpu", "dep:futures-channel"]
bench = []

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "alloc_stats"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["gpu", "simd"]

[[test]]
name = "tv_equivalence"
required-features = ["bench"]
