# Ship binaries compiled for a real SIMD ISA instead of the x86-64 baseline
# (SSE2), where `std::simd`'s 8/64-lane vectors degrade to split SSE ops.
# x86-64-v3 = AVX2/FMA/BMI2 (Haswell, 2013+).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

# Without this `std::simd` on wasm is scalar emulation.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
